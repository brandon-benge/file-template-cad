name: Deploy File Template CAD viewer

on:
  workflow_run:
    workflows: ["File Template CAD CI"]
    types:
      - completed
    branches: [main]
  # 2026-11-03: CI starts the deploy itself after a MakeItOurs ticket (see ci.yml ticket-downstream).
  workflow_dispatch:
    inputs:
      head_sha:
        description: The commit on main that CI passed
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: 1

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
      - name: Verify commit SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha || inputs.head_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install from lock
        run: |
          pip install --require-hashes -r requirements/locks/dev-ubuntu-x86_64-py313.lock
          pip check
      - name: Validate
        run: python-cad validate --project-root .
      - name: Clean
        run: python-cad clean --project-root .
      - name: Build
        run: python-cad build --project-root .
      - name: Verify
        run: python-cad verify --project-root .
      - name: Prepare site
        run: python-cad prepare-site --project-root . --destination site --base-path /file-template-cad/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  # A deploy CI started after a MakeItOurs ticket reports its result to makeitours-outcome.yml.
  ticket-report:
    needs:
      - deploy
    if: always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ inputs.head_sha }}
      RESULT: ${{ needs.deploy.result }}
    steps:
      - name: Report to the MakeItOurs outcome workflow
        run: |
          # Only a project that has the outcome workflow gets a report.
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/makeitours-outcome.yml?ref=$HEAD_SHA" --silent 2>/dev/null || exit 0
          case "$RESULT" in success) conclusion=success ;; cancelled) conclusion=cancelled ;; skipped) conclusion=skipped ;; *) conclusion=failure ;; esac
          gh workflow run makeitours-outcome.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f workflow=pages.yml -f head_sha="$HEAD_SHA" -f conclusion="$conclusion" -f run_id="$GITHUB_RUN_ID"
