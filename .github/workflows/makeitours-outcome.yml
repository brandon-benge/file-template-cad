name: makeitours-outcome

# 2026-10-30 (data-plane#249): a MakeItOurs ticket pushes its change to main before CI, the
# release and the site deploy run, so a saved change can fail to go live. When one of them
# finishes on main, reply once on the change's issue: live with its version, or saved but not
# published with the failing check (makeitours-agentic-git-run outcome, in the same pinned image
# as makeitours.yml). The next ticket is told the same from GitHub's own results.
on:
  workflow_run:
    workflows:
      - "File Template CAD CI"
      - "Package and release File Template CAD"
      - "Deploy File Template CAD viewer"
    types: [completed]
    branches: [main]
  # 2026-11-03 (benge-property-cad#26): runs a ticket started fire no workflow_run event, so CI,
  # the release and the deploy report their own result here.
  workflow_dispatch:
    inputs:
      workflow:
        description: ci.yml, release-template.yml or pages.yml
        required: true
      head_sha:
        description: The commit on main the run was for
        required: true
      conclusion:
        description: success, failure, cancelled or skipped
        required: true
      run_id:
        description: The reporting run
        required: true

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: makeitours-outcome-${{ github.event.workflow_run.head_sha || inputs.head_sha }}
  cancel-in-progress: false

jobs:
  outcome:
    name: Report the MakeItOurs outcome
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # makeitours-agentic v0.1.103. Updated only by a template commit.
      image: ghcr.io/brandon-benge/makeitours-agentic-runner@sha256:b9f1ff0a165969dd1f152861b5bb4434297baa67a811c08299c4873b8608b65d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reply on the change's issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: makeitours-agentic-git-run outcome
