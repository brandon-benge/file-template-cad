name: Rebuild File Template CAD viewer at selected python-cad-tools version

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-pages
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: 1

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install selected python-cad-tools version
        env:
          AICAD_PYTHON_CAD_TOOLS_VERSION: ${{ vars.AICAD_PYTHON_CAD_TOOLS_VERSION }}
        run: |
          tools/install-selected-python-cad-tools \
            --lock requirements/locks/dev-ubuntu-x86_64-py313.lock
          pip check
      - name: Validate
        run: python-cad validate --project-root .
      - name: Clean
        run: python-cad clean --project-root .
      - name: Build
        run: python-cad build --project-root .
      - name: Verify
        run: python-cad verify --project-root .
      - name: Prepare site
        run: python-cad prepare-site --project-root . --destination site --base-path /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tag deployed version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(python -c 'import importlib.metadata; print(importlib.metadata.version("python-cad-tools"))')"
          sha="$(git rev-parse --short HEAD)"
          tag="aicad-deploy-${version}-${sha}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag already exists: ${tag}"
          else
            git tag "${tag}"
            git push origin "${tag}"
            echo "Created tag: ${tag}"
          fi

  update-lock:
    needs: rebuild-and-deploy
    if: needs.rebuild-and-deploy.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconcile the committed lock with the deployed version
        id: reconcile
        env:
          AICAD_PYTHON_CAD_TOOLS_VERSION: ${{ vars.AICAD_PYTHON_CAD_TOOLS_VERSION }}
        run: |
          if [ -z "${AICAD_PYTHON_CAD_TOOLS_VERSION}" ]; then
            echo "No version selected; the committed lock is already what was deployed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tools/install-selected-python-cad-tools \
            --lock requirements/locks/dev-ubuntu-x86_64-py313.lock \
            --output requirements/locks/dev-ubuntu-x86_64-py313.lock
          if git diff --quiet -- requirements/locks/dev-ubuntu-x86_64-py313.lock; then
            echo "Lock already pins ${AICAD_PYTHON_CAD_TOOLS_VERSION}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${AICAD_PYTHON_CAD_TOOLS_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Open and merge the lock-update pull request
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.reconcile.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha="$(git rev-parse --short HEAD)"
          branch="chore/update-python-cad-tools-lock-${VERSION}-${sha}"
          git checkout -b "$branch"
          git add requirements/locks/dev-ubuntu-x86_64-py313.lock
          git commit \
            -m "chore: pin python-cad-tools to ${VERSION} in the committed lock" \
            -m "Regenerated by the rebuild-and-deploy workflow after a successful build and deploy at this version. Only the dev-ubuntu-x86_64-py313 lock is updated here — the platform this workflow actually built and verified against; other platform locks are unaffected."
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: pin python-cad-tools to ${VERSION} in the committed lock" \
            --body "Automated by rebuild-and-deploy after a successful build, verify, and deploy at python-cad-tools ${VERSION}. Bumps the dev-ubuntu-x86_64-py313 lock only. Full CI runs against this PR before it merges."
          # Try an immediate merge first (the content was already built and
          # verified moments ago in this same run); fall back to GitHub's
          # native auto-merge if branch protection requires checks/review,
          # so the PR still merges itself once CI on it goes green instead
          # of being stranded for a human.
          gh pr merge "$branch" --squash --delete-branch \
            || gh pr merge "$branch" --squash --auto --delete-branch \
            || echo "PR left open: branch protection blocks both immediate and auto-merge. Manual merge required."
