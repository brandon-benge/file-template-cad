name: opencode

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: git-opencode-${{ github.repository }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  opencode:
    name: Handle Git-triggered OpenCode request
    if: >
      github.actor == github.repository_owner &&
      (
        github.event_name == 'issues' ||
        (
          github.event_name == 'issue_comment' &&
          (
            startsWith(github.event.comment.body, '/oc') ||
            startsWith(github.event.comment.body, '/opencode')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned OpenCode and validation environment
        shell: bash
        run: |
          npm install --global opencode-ai@1.15.2
          test "$(opencode --version)" = "1.15.2"
          python -m venv .audit-venv
          .audit-venv/bin/pip install --require-hashes -r requirements/locks/dev-ubuntu-x86_64-py313.lock

      - name: Normalize trigger
        shell: bash
        run: |
          jq -n \
            --slurpfile event "$GITHUB_EVENT_PATH" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_id "${{ github.event.repository.id }}" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            '{
              event_name: $event_name,
              repository: $repository,
              repository_id: $repository_id,
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              actor: $actor,
              ref: $ref,
              trigger_sha: $sha,
              issue: {
                number: $event[0].issue.number,
                title: $event[0].issue.title,
                body: ($event[0].issue.body // "")
              },
              comment: (if $event_name == "issue_comment" then {
                id: $event[0].comment.id,
                body: ($event[0].comment.body // "")
              } else null end)
            }' > "$RUNNER_TEMP/aicad-trigger.json"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Run OpenCode with repository audit
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: glm-5.2
          OPENCODE_AGENT: file-design-maintainer
          AICAD_VALIDATION_EXECUTABLE: .audit-venv/bin/python-cad
          AICAD_FAILURE_ARTIFACT_DIR: ${{ runner.temp }}/aicad-failure-artifacts
        run: tools/run-git-opencode-audit "$RUNNER_TEMP/aicad-trigger.json"

      - name: Upload audit evidence when the transaction fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aicad-failure-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 14
