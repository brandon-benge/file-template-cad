name: opencode

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: git-opencode-${{ github.repository }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  opencode:
    name: Handle Git-triggered OpenCode request
    if: >
      github.actor == github.repository_owner &&
      (
        github.event_name == 'issues' ||
        (
          github.event_name == 'issue_comment' &&
          (
            startsWith(github.event.comment.body, '/oc') ||
            startsWith(github.event.comment.body, '/opencode')
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/locks/dev-ubuntu-x86_64-py313.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore validation environment
        id: validation-environment-cache
        uses: actions/cache@v4
        with:
          path: .audit-venv
          key: opencode-audit-venv-${{ runner.os }}-${{ runner.arch }}-py313-${{ hashFiles('requirements/locks/dev-ubuntu-x86_64-py313.lock') }}

      - name: Install latest OpenCode and validation environment
        shell: bash
        run: |
          npm install --global opencode-ai@latest
          test -n "$(opencode --version)"
          if test "${{ steps.validation-environment-cache.outputs.cache-hit }}" != "true"; then
            python -m venv .audit-venv
            .audit-venv/bin/pip install --require-hashes -r requirements/locks/dev-ubuntu-x86_64-py313.lock
          fi
          .audit-venv/bin/python-cad --help >/dev/null

      - name: Normalize trigger
        shell: bash
        run: |
          jq -n \
            --slurpfile event "$GITHUB_EVENT_PATH" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repository_id "${{ github.event.repository.id }}" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg actor "$GITHUB_ACTOR" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            '{
              event_name: $event_name,
              repository: $repository,
              repository_id: $repository_id,
              workflow: $workflow,
              run_id: $run_id,
              run_attempt: $run_attempt,
              actor: $actor,
              ref: $ref,
              trigger_sha: $sha,
              issue: {
                number: $event[0].issue.number,
                title: $event[0].issue.title,
                body: ($event[0].issue.body // "")
              },
              comment: (if $event_name == "issue_comment" then {
                id: $event[0].comment.id,
                body: ($event[0].comment.body // "")
              } else null end)
            }' > "$RUNNER_TEMP/makeitours-trigger.json"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name "opencode[bot]"
          git config user.email "opencode[bot]@users.noreply.github.com"

      - name: Run OpenCode with repository audit
        shell: bash
        env:
          MAKEITOURS_OPENCODE_MODEL: ${{ vars.MAKEITOURS_OPENCODE_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENCODE_AGENT: file-design-maintainer
          MAKEITOURS_VALIDATION_EXECUTABLE: .audit-venv/bin/python-cad
          MAKEITOURS_FAILURE_ARTIFACT_DIR: ${{ runner.temp }}/makeitours-failure-artifacts
        run: tools/run-git-opencode-audit "$RUNNER_TEMP/makeitours-trigger.json"

      - name: Trigger downstream main-branch workflows
        # A commit pushed here with the default GITHUB_TOKEN does not fire
        # other workflows' `push` triggers (GitHub's anti-recursion rule:
        # github.com/orgs/community/discussions/25702), so ci.yml,
        # release-template.yml, and test-ci.yml would otherwise silently skip
        # this commit, and pages.yml (which deploys off ci.yml completing)
        # would never run either. Dispatching them explicitly is exempt from
        # that rule and needs no additional token beyond `actions: write`.
        # Runs only when the audit step above succeeded (a real push landed).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run release-template.yml --ref main
          gh workflow run test-ci.yml --ref main

      - name: Upload audit evidence when the transaction fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/makeitours-failure-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
          retention-days: 14
