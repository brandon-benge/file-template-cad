name: Package File Template CAD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create deterministic template archive
        run: |
          git archive --format=tar --prefix=file-template-cad/ HEAD \
            | gzip -n > file-template-cad.tar.gz
          sha256sum file-template-cad.tar.gz > file-template-cad.tar.gz.sha256
      - name: Upload package for this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-template-cad-${{ github.sha }}
          path: |
            file-template-cad.tar.gz
            file-template-cad.tar.gz.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: file-template-cad-${{ github.sha }}
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            file-template-cad.tar.gz \
            file-template-cad.tar.gz.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes

