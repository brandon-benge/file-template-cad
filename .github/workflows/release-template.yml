name: Package and release File Template CAD

# Releases a commit on main only after CI passed on it (test-cost-reduction,
# 2026-10-12): before, every push to any branch released, even with CI red,
# and pushes that weren't meant to release needed "[skip ci]". A "[skip ci]"
# push now skips CI and so also the release. A manual dispatch (the hosted
# runner dispatches this workflow after its own push) releases the
# dispatched ref as before.
on:
  workflow_run:
    workflows: ["File Template CAD CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed on (a workflow_run's own SHA is main's latest).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          base_version="$(python3 - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          release_version="${base_version}.${GITHUB_RUN_NUMBER}"
          echo "base=${base_version}" >> "$GITHUB_OUTPUT"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${release_version}" >> "$GITHUB_OUTPUT"

      - name: Create deterministic template archive
        # The archive also carries .makeitours/template-release.json (its own tag), and the
        # release publishes template-policy.json beside it (2026-10-09 approval,
        # project-upgrade-button). Repacked with sorted names, the commit's time and
        # numeric owners, so the same commit and tag always give the same bytes.
        run: |
          rm -rf staging && mkdir staging
          git archive --format=tar --prefix=file-template-cad/ HEAD | tar -x -C staging
          python3 tools/release-identity staging/file-template-cad \
            "${{ steps.version.outputs.tag }}" "$(git rev-parse HEAD)" template-policy.json
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C staging -cf - file-template-cad | gzip -n > file-template-cad.tar.gz
          sha256sum file-template-cad.tar.gz > file-template-cad.tar.gz.sha256
          sha256sum template-policy.json > template-policy.json.sha256

      - name: Upload package for this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: file-template-cad-${{ steps.version.outputs.version }}
          path: |
            file-template-cad.tar.gz
            file-template-cad.tar.gz.sha256
            template-policy.json
            template-policy.json.sha256
          if-no-files-found: error

      - name: Create and push version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            file-template-cad.tar.gz \
            file-template-cad.tar.gz.sha256 \
            template-policy.json \
            template-policy.json.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes

